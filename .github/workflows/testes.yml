name: Testes da ferramenta de banco

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  teste:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar lógica e tratamento de falhas
        run: node --test testes/diagnostico.test.js
      - name: Executar demonstração sintética
        run: node src/cli.js --demo
