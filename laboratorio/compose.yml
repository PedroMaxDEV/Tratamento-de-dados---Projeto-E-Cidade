services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecidade_laboratorio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha_apenas_laboratorio
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ecidade_laboratorio']
      interval: 5s
      timeout: 3s
      retries: 10
